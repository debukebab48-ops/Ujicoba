<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Dimensi Tarik — Tahap 1</title>
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <video id="cam" playsinline webkit-playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
  <canvas id="debug"></canvas>

  <div id="hud" hidden>
    <div id="hud-fps">-- fps</div>
    <div id="hud-delegate">delegate: -</div>
    <div id="hud-metrics"></div>
    <div id="hud-chips"></div>
  </div>

  <div id="banner" hidden></div>

  <div id="overlay">
    <div id="overlay-card">
      <h1>Dimensi Tarik</h1>
      <p id="overlay-msg">Menyiapkan kamera…</p>
      <button id="overlay-btn" hidden>Mulai</button>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
